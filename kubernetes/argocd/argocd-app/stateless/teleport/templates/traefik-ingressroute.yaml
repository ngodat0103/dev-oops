apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: teleport-proxy
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  ingressClassName: traefik
  entryPoints:
    - websecure
    - web
  routes:
    - match: HostSNI(`teleport.datrollout.dev`)
      services:
        - name: teleport
          port: 443
  tls:
    passthrough: true