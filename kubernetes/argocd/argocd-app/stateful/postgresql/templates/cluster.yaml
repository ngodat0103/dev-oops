# yaml-language-server: $schema=https://raw.githubusercontent.com/datreeio/CRDs-catalog/refs/heads/main/postgresql.cnpg.io/cluster_v1.json

# https://cloudnative-pg.io/docs/1.30/cloudnative-pg.v1#cluster
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgresql
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  imageName: ghcr.io/ngodat0103/dev-oops/cnpg-postgresql-wal2json:16.14
  postgresql:
    parameters:
      shared_buffers: "256MB" # 25% of 1Gi limit
      effective_cache_size: "640MB" # ~60% — conservative given tight limit
      work_mem: "4MB" # lowered — 200 conns × work_mem was the real risk
      maintenance_work_mem: "64MB"
      hash_mem_multiplier: "2.0" # kept, but base work_mem now smaller so peak is bounded

      # ---------- Connections ----------
      max_connections: "100" # 200 was oversized for homelab; pooler still fans in fine
      superuser_reserved_connections: "3"

      # ---------- Parallelism
      max_worker_processes: "4"
      max_parallel_workers: "2"
      max_parallel_workers_per_gather: "1"
      max_parallel_maintenance_workers: "1"

      # ---------- WAL & checkpoints
      wal_level: logical
      wal_buffers: "16MB"
      min_wal_size: "512MB"
      max_wal_size: "2GB"
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "15min"
      max_replication_slots: "10"
      # ---------- Autovacuum ----------
      autovacuum: "on"
      autovacuum_max_workers: "2"
      autovacuum_naptime: "20s"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_scale_factor: "0.02"
      autovacuum_vacuum_cost_limit: "1000"
      # ---------- Logging / observability (unchanged) ----------
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_lock_waits: "on"
      log_temp_files: "0"
      log_autovacuum_min_duration: "1000"
      # ---------- Misc safety ----------
      statement_timeout: "0"
      idle_in_transaction_session_timeout: "300000"
      lock_timeout: "30s"
      jit: "off"
      # ---------- Stats ----------
      track_io_timing: "on"
      track_functions: "pl"
      pg_stat_statements.track: "all"
  resources:
    requests:
      memory: 1Gi
      cpu: 200m
    limits:
      memory: 1Gi
      cpu: 4000m
  enableSuperuserAccess: true
  superuserSecret:
    name: postgres-admin
  monitoring:
    enablePodMonitor: true
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      barmanObjectName: cloudflare-r2
  managed:
    services:
      additional:
      - selectorType: rw
        serviceTemplate:
          metadata:
            name: postgresql-external-rw
          spec:
            type: LoadBalancer
  instances: 2
  primaryUpdateMethod: switchover
  storage:
    size: 30Gi
