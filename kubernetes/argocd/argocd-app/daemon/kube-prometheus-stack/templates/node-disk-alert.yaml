apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: node-disk-usage
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: node-disk-usage
      rules:
        - alert: NodeDiskUsage
          expr: |
            100 * (
              1 - node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|squashfs|overlay|fuse.juicefs"}
                / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|squashfs|overlay|fuse.juicefs"}
            ) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{ `'Disk {{ $labels.mountpoint }} on {{ $labels.instance }} above 90%'` }}
            description: {{ `'{{ $labels.device }} mounted at {{ $labels.mountpoint }} is {{ $value | printf "%.1f" }}% full.'` }}

        - alert: NodeDiskUsage
          expr: |
            100 * (
              1 - node_filesystem_avail_bytes{job="node-exporter",fstype!~"tmpfs|squashfs|overlay|fuse.juicefs"}
                / node_filesystem_size_bytes{job="node-exporter",fstype!~"tmpfs|squashfs|overlay|fuse.juicefs"}
            ) > 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: {{ `'Disk {{ $labels.mountpoint }} on {{ $labels.instance }} above 95%'` }}
            description: {{ `'{{ $labels.device }} mounted at {{ $labels.mountpoint }} is {{ $value | printf "%.1f" }}% full. Act now.'` }}

        # Inodes fill up independently of bytes — bites you with many small files
        - alert: NodeDiskInodeUsage
          expr: |
            100 * (
              1 - node_filesystem_files_free{job="node-exporter",fstype!~"tmpfs|squashfs|overlay|fuse.juicefs"}
                / node_filesystem_files{job="node-exporter",fstype!~"tmpfs|squashfs|overlay|fuse.juicefs"}
            ) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: {{ `'Inode usage on {{ $labels.instance }}:{{ $labels.mountpoint }} above 90%'` }}