{{- if and (.Values.certManager) (.Values.certManager.enabled) -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  labels:
    applicationType: stateless
spec:
  project: default
  syncPolicy:
    retry:
      limit: 1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    automated:
      enabled: false
      prune: false
      selfHeal: false
  destination:
    namespace: cert-manager
    name: in-cluster
  source:
    repoURL: https://github.com/ngodat0103/home-lab.git
    targetRevision: master
    path: kubernetes/argocd/argocd-app/platform/cert-manager
    helm:
      valueFiles:
        - values.yaml
        - secrets://secrets.enc.yaml
{{- end }}