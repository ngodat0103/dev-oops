{{- if .Values.postgresql.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-postgresql
  namespace: argocd
  labels:
    applicationType: stateful
spec:
  project: default
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    - CreateNamespace=true
    automated:
      enabled: false
      prune: false
      selfHeal: false
  destination:
    namespace: prod-postgresql
    name: in-cluster
  source:
    repoURL: https://github.com/ngodat0103/home-lab.git
    targetRevision: master
    path: kubernetes/argocd/argocd-app/stateful/postgresql
    helm:
      valueFiles:
        - values.yaml
        - secrets://secrets.enc.yaml
{{- end }}
