{{- if and (.Values.crowdsec) (.Values.crowdsec.enabled) -}}
apiVersion: "argoproj.io/v1alpha1"
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
  labels:
    applicationType: stateless
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: default
  syncPolicy:
    syncOptions: [ "CreateNamespace=true" ]
    automated:
      enabled: false
      selfHeal: true
      prune: true
    retry:
      limit: 1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  destination:
    namespace: crowdsec
    name: in-cluster
  source:
    repoURL: https://github.com/ngodat0103/home-lab.git
    targetRevision: master
    path: kubernetes/argocd/argocd-app/platform/crowdsec
{{- end -}}