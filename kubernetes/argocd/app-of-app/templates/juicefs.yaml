{{- if and (.Values.juicefs) (.Values.juicefs.enabled) -}}
apiVersion: "argoproj.io/v1alpha1"
kind: Application
metadata:
  name: juicefs
  namespace: argocd
  labels:
    applicationType: daemon
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  revisionHistoryLimit: 3
  project: default
  syncPolicy:
    automated:
      enabled: false
      selfHeal: false
      prune: true
    retry:
      limit: 1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  destination:
    namespace: juicefs
    name: in-cluster
  source:
    repoURL: https://github.com/ngodat0103/dev-oops.git
    targetRevision: master
    path: kubernetes/argocd/argocd-app/platform/juicefs
{{- end -}}