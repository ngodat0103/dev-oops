{{- if and (.Values.mongo) (.Values.mongo.enabled) -}}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mongo-operator
  namespace: argocd
  labels:
    applicationType: stateful
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ngodat0103/dev-oops.git
    path: kubernetes/argocd/argocd-app/stateful/mongo
    targetRevision: master
  destination:
    name: in-cluster
    namespace: mongo
  syncPolicy:
    automated:
      enabled: false
      selfHeal: false
      prune: false
    retry:
      limit: 1
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
{{- end -}}